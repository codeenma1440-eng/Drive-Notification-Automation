name: Drive 3 Watcher (VORMS)

# Triggered every few minutes by cron-job.org (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: write

# One run at a time for THIS drive. Other drives run independently.
concurrency:
  group: drive3-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run drive watcher
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_drive.py drive3

      - name: Save manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add manifests/vorms.json
          git diff --staged --quiet && exit 0
          git commit -m "manifest: drive3"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep $((RANDOM % 8 + 2))
          done
          echo "push failed" && exit 1v
