name: Drive 3 Watcher (VORMS)

on:
  workflow_dispatch:

concurrency:
  group: drive3-watcher
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth google-auth-oauthlib google-api-python-client requests
      - name: Run drive watcher
        env:
          DRIVE_KEY: drive3
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_drive.py
      - name: Save manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add manifest_drive3.json
          git diff --staged --quiet || git commit -m "Update manifest drive3"
          git push
